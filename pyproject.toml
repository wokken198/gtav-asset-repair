[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gtav-asset-repair"
version = "0.7.7.7"
description = "Small GTA V asset helpers: badge normal maps, CPedVariationInfo auditing, DDS rescaling, YTD packing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy", "Pillow"]
keywords = ["gta5", "modding", "dds", "normal-map", "ytd", "rpf", "codewalker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/wokken198/gtav-asset-repair"
Repository = "https://github.com/wokken198/gtav-asset-repair"
Issues = "https://github.com/wokken198/gtav-asset-repair/issues"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gtav-asset-repair = "gtav_asset_repair.cli:main"
gtav-asset-repair-gui = "gtav_asset_repair.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
